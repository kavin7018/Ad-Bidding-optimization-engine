services:
  app:
    build: .
    container_name: "app"
    ports:
      - "2112:2112"
    command: [ "./app" ] # Ensure this matches your built Go binary name
    networks:
      - application-network

  pulsar:
    image: apachepulsar/pulsar:latest
    container_name: pulsar
    restart: always
    depends_on:
      - app
    command: bin/pulsar standalone
    environment:
      - PULSAR_BROKER_TOPIC_AUTOCREATION_ENABLE=true # Enable topic autocreation
    ports:
      - "6650:6650" # Binary protocol
      - "8080:8080" # Pulsar admin REST API
    networks:
      - application-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    depends_on:
      - pulsar
    ports:
      - "6379:6379"
    networks:
      - application-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./configuration.yml:/etc/prometheus/prometheus.yml
    networks:
      - application-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/dashboard.yaml:/etc/grafana/provisioning/dashboard.yaml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

networks:
  application-network:
    driver: bridge
